
name: R syntax validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.3'

      - name: Parse all R scripts
        shell: bash
        run: |
          Rscript -e '
            files <- list.files(
              "scripts",
              pattern = "\\.R$",
              recursive = TRUE,
              full.names = TRUE
            )

            if (length(files) == 0) {
              stop("No R scripts found.")
            }

            for (f in files) {
              cat("Checking:", f, "\n")
              parse(file = f)
            }

            cat(
              "SUCCESS: All",
              length(files),
              "R scripts passed syntax validation.\n"
            )
          '
