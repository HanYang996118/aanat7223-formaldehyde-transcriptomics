
name: R syntax check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  parse-r-scripts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
      - name: Parse all R scripts
        shell: bash
        run: |
          Rscript -e 'files <- list.files("scripts", pattern = "\\.R$", recursive = TRUE, full.names = TRUE); stopifnot(length(files) > 0); invisible(lapply(files, parse)); cat("Parsed", length(files), "R scripts successfully.\n")'
